name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "error:|warning: \[|What went wrong|FAILED" -A2 build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk JianNote-v1.1.${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab JianNote-v1.1.${{ github.run_number }}-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: JianNote-apk
          path: |
            JianNote-*.apk
            JianNote-*.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JianNote v1.1.${{ github.run_number }}
          body: "APK = 태블릿에 직접 설치용 / AAB = 구글 플레이 콘솔 업로드용"
          files: |
            JianNote-*.apk
            JianNote-*.aab
          make_latest: true
