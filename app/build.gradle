plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.kjt.jiannote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kjt.jiannote'
        minSdk 29
        targetSdk 36
        versionCode runNumber
        versionName "1.1.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('inkshelf.keystore')
            storePassword 'inkshelf'
            keyAlias 'inkshelf'
            keyPassword 'inkshelf'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language { enableSplit = false }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 자동 점검(단위 테스트): 실제 안드로이드 그리기 코드로 캔버스를 돌려 본다. 앱 자체에는 포함되지 않음
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '3g'
                systemProperty 'artifacts.dir', "${buildDir}/test-artifacts"
                systemProperty 'robolectric.logging', 'stdout'
                testLogging {
                    events 'passed', 'failed', 'skipped'
                    exceptionFormat 'full'
                    showStandardStreams = true
                }
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}
