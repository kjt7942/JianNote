plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.kjt.jiannote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kjt.jiannote'
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('inkshelf.keystore')
            storePassword 'inkshelf'
            keyAlias 'inkshelf'
            keyPassword 'inkshelf'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
