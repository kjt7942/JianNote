plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.kjt.jiannote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kjt.jiannote'
        minSdk 29
        targetSdk 36
        versionCode runNumber
        versionName "1.1.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('inkshelf.keystore')
            storePassword 'inkshelf'
            keyAlias 'inkshelf'
            keyPassword 'inkshelf'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language { enableSplit = false }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
}
